receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  prometheus/metrics:
    endpoint: 0.0.0.0:8889
    metric_expiration: 5m
    enable_open_metrics: true
  otlphttp/traces:
    endpoint: http://capacity-tempo:4318
    timeout: 3s
    sending_queue:
      queue_size: 128
      num_consumers: 2
    retry_on_failure:
      initial_interval: 250ms
      max_interval: 1s
      max_elapsed_time: 30s
  otlphttp/logs:
    endpoint: http://capacity-loki:3100/otlp
    timeout: 3s
    sending_queue:
      queue_size: 128
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 30s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs]
