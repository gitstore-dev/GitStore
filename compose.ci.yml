services:
  git-service:
    environment:
      GITSTORE_GRPC_AUTH__HMAC_SECRET: ${GITSTORE_GRPC_AUTH__HMAC_SECRET:?CI gRPC HMAC secret is required}

  api:
    environment:
      GITSTORE_API__AUTH__JWT__SECRET: ${GITSTORE_API__AUTH__JWT__SECRET:?CI JWT secret is required}
      GITSTORE_GRPC_AUTH__HMAC_SECRET: ${GITSTORE_GRPC_AUTH__HMAC_SECRET:?CI gRPC HMAC secret is required}
