version: v2
inputs:
  - directory: shared/proto
plugins:
  - local: protoc-gen-prost
    out: gitstore-git-service/gen
    opt:
      - compile_well_known_types=true
      - extern_path=.google.protobuf=::pbjson_types
  - local: protoc-gen-tonic
    out: gitstore-git-service/gen
    opt:
      - compile_well_known_types=true
      - extern_path=.google.protobuf=::pbjson_types
