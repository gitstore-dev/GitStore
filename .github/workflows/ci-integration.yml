name: CI Integration

# Runs ONLY when files relevant to the gRPC/datastore contracts or service implementations change.
# This workflow is NOT a required branch-protection status check.
# Core CI (ci.yml) gates merge; these tests provide deeper validation when warranted.

on:
  push:
    branches: [ main ]
    paths:
      - 'gitstore-api/**'
      - 'gitstore-git-service/**'
      - 'gitstore-controller-manager/**'
      - 'tests/integration/**'
      - 'shared/proto/**'
      - 'Makefile'
      - 'docker/git-service.Dockerfile'
      - 'docker/api.Dockerfile'
      - 'docker/controller-manager.Dockerfile'
      - 'compose.yml'
      - 'compose.local.yml'
      - 'compose.ci.yml'
      - 'compose.scylla.yml'
      - 'compose.scylla.cluster.yml'
      - 'config/config.toml'
      - 'config/policy.yaml'
      - '.github/workflows/ci-integration.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gitstore-api/**'
      - 'gitstore-git-service/**'
      - 'gitstore-controller-manager/**'
      - 'tests/integration/**'
      - 'shared/proto/**'
      - 'Makefile'
      - 'docker/git-service.Dockerfile'
      - 'docker/api.Dockerfile'
      - 'docker/controller-manager.Dockerfile'
      - 'compose.yml'
      - 'compose.local.yml'
      - 'compose.ci.yml'
      - 'compose.scylla.yml'
      - 'compose.scylla.cluster.yml'
      - 'config/config.toml'
      - 'config/policy.yaml'
      - '.github/workflows/ci-integration.yml'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Integration (memdb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # CI-specific credentials override the tracked development fixture.
    env:
      GITSTORE_GIT__DATA_DIR: ./data/repos
      GITSTORE_AUTH__ADMIN__USERNAME: admin
      GITSTORE_AUTH__ADMIN__PASSWORD_HASH: "$2a$10$awdOeTC5BhJGSasW9EdvO.4wnP7SbC96ycmbPx5dxIxEdbHye6eOy"
      GITSTORE_AUTH__JWT__SECRET: ci-test-jwt-secret-minimum-32-characters-long
      GITSTORE_AUTH__GRPC__HMAC_SECRET: ci-test-grpc-hmac-secret

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: tests/integration/go.sum

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Build and start core stack
      run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml up -d --build

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for gitstore-api (GraphQL + git HTTP)..."
        timeout 60 sh -c 'until curl -sf http://localhost:4000/health; do sleep 2; done'
        docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml ps

    - name: Wait for git-service gRPC to be ready
      run: timeout 30 sh -c 'until nc -z localhost 50051; do sleep 1; done'

    - name: Wait for CatalogService gRPC to be ready
      run: timeout 30 sh -c 'until nc -z localhost 6000; do sleep 1; done'

    - name: Wait for controller-manager to be healthy
      run: timeout 30 sh -c 'until curl -sf http://localhost:5001/health; do sleep 1; done'

    - name: Bootstrap namespace and repository
      # admin123 is the plaintext for the stub bcrypt hash set in GITSTORE_AUTH__ADMIN__PASSWORD_HASH above
      run: make bootstrap ADMIN_PASSWORD=admin123 NAMESPACE=gitci NAMESPACE_DISPLAY_NAME=CI NAMESPACE_TIER=USER REPOSITORY=catalog

    - name: Seed repository with initial commit
      run: |
        git config --global user.email "ci@gitstore.dev"
        git config --global user.name "CI"
        git config --global init.defaultBranch main
        git config --global credential.helper store
        printf 'protocol=http\nhost=localhost:5000\nusername=admin\npassword=admin123\n\n' | git credential approve
        tmpdir=$(mktemp -d)
        git clone http://localhost:5000/gitci/catalog.git "$tmpdir"
        echo "# CI seed" > "$tmpdir/README.md"
        git -C "$tmpdir" add README.md
        git -C "$tmpdir" commit -m "ci: seed initial commit"
        git -C "$tmpdir" push origin main

    - name: Run full integration suite
      working-directory: ./tests/integration
      env:
        NAMESPACE: gitci
        REPOSITORY: catalog
      run: go test -count=1 -v -timeout 240s ./...

    - name: Collect logs on failure
      if: failure()
      run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml logs

    - name: Cleanup
      if: always()
      run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml down -v

  datastore-contract-test:
    name: Datastore Hardening (backend-neutral + memdb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: gitstore-api/go.sum

    - name: Run backend-neutral datastore hardening
      run: make test-scylla-hardening

    - name: Run memdb datastore contracts
      working-directory: ./gitstore-api
      run: go test -tags memdb -count=1 -v -race -timeout 180s ./tests/contract/datastore/...

  integration-test-scylla:
    name: Integration (ScyllaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GITSTORE_GIT__DATA_DIR: ./data/repos
      GITSTORE_AUTH__ADMIN__USERNAME: admin
      GITSTORE_AUTH__ADMIN__PASSWORD_HASH: "$2a$10$awdOeTC5BhJGSasW9EdvO.4wnP7SbC96ycmbPx5dxIxEdbHye6eOy"
      GITSTORE_AUTH__JWT__SECRET: ci-test-jwt-secret-minimum-32-characters-long
      GITSTORE_AUTH__GRPC__HMAC_SECRET: ci-test-grpc-hmac-secret

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: tests/integration/go.sum

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build and start core stack with ScyllaDB
        run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml -f compose.scylla.yml up -d --build

      - name: Wait for ScyllaDB to be healthy
        run: timeout 120 sh -c 'until nc -z localhost 9042; do sleep 2; done'

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for gitstore-api (GraphQL + git HTTP)..."
          timeout 90 sh -c 'until curl -sf http://localhost:4000/health; do sleep 2; done'
          docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml -f compose.scylla.yml ps

      - name: Wait for git-service gRPC to be ready
        run: timeout 30 sh -c 'until nc -z localhost 50051; do sleep 1; done'

      - name: Wait for CatalogService gRPC to be ready
        run: timeout 30 sh -c 'until nc -z localhost 6000; do sleep 1; done'

      - name: Wait for controller-manager to be healthy
        run: timeout 30 sh -c 'until curl -sf http://localhost:5001/health; do sleep 1; done'

      - name: Bootstrap namespace and repository
        run: make bootstrap ADMIN_PASSWORD=admin123 NAMESPACE=gitci NAMESPACE_DISPLAY_NAME=CI NAMESPACE_TIER=USER REPOSITORY=catalog

      - name: Seed repository with initial commit
        run: |
          git config --global user.email "ci@gitstore.dev"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global credential.helper store
          printf 'protocol=http\nhost=localhost:5000\nusername=admin\npassword=admin123\n\n' | git credential approve
          tmpdir=$(mktemp -d)
          git clone http://localhost:5000/gitci/catalog.git "$tmpdir"
          echo "# CI seed" > "$tmpdir/README.md"
          git -C "$tmpdir" add README.md
          git -C "$tmpdir" commit -m "ci: seed initial commit"
          git -C "$tmpdir" push origin main

      - name: Run full integration suite
        working-directory: ./tests/integration
        env:
          NAMESPACE: gitci
          REPOSITORY: catalog
        run: go test -count=1 -v -timeout 240s ./...

      - name: Collect logs on failure
        if: failure()
        run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml -f compose.scylla.yml logs

      - name: Cleanup
        if: always()
        run: docker compose --profile local -f compose.yml -f compose.local.yml -f compose.ci.yml -f compose.scylla.yml down -v

  datastore-contract-test-scylla:
    name: Datastore Hardening (tagged ScyllaDB + failure injection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: gitstore-api/go.sum

    - name: Start ScyllaDB
      run: |
        docker run -d --name gitstore-scylla-test \
          -p 9042:9042 \
          scylladb/scylla:5.4 \
          --developer-mode=1 --overprovisioned=1 --smp=1
        timeout 120 sh -c 'until docker exec gitstore-scylla-test cqlsh -e "describe cluster"; do sleep 2; done'

    - name: Run tagged Scylla hardening and failure-injection tests
      run: make test-scylla-integration SCYLLA_TEST_ADDR=127.0.0.1:9042

    - name: Stop ScyllaDB
      if: always()
      run: docker rm -f gitstore-scylla-test || true

  repair-cli-test:
    name: Projection Repair CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: gitstore-api/go.sum

    - name: Run repair CLI tests
      working-directory: ./gitstore-api
      run: |
        test -f ./cmd/gitctl/main_test.go
        go test -count=1 -v -timeout 90s ./cmd/gitctl

    - name: Run repair planning and conditional-apply tests
      working-directory: ./gitstore-api
      run: >-
        go test -count=1 -v -timeout 90s
        -run 'Test(BuildRepairPlan|ProjectionRepairService|ValidateRepairPlan)'
        ./internal/datastore/scylla

  grpc-contract-test:
    name: gRPC Contract Tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: gitstore-api/go.sum

    - name: Build git-service Docker image
      run: docker build -f docker/git-service.Dockerfile -t gitstore-git-service:latest .

    - name: Run gRPC contract tests
      working-directory: ./gitstore-api
      run: go test -tags grpc -v -timeout 5m ./tests/contract/grpc/...

  controller-manager-contract-test:
    name: Controller Manager Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
        cache-dependency-path: gitstore-controller-manager/go.sum

    - name: Run controller-manager contract tests
      working-directory: ./gitstore-controller-manager
      run: go test -v -race -timeout 60s ./tests/contract/...
