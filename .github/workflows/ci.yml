name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'codex/**' ]
  merge_group:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  shared-module-test:
    name: Shared Go Module Tests
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
    - uses: actions/checkout@v6
      id: checkout
    - uses: actions/setup-go@v6
      id: go_observability
      with:
        go-version-file: shared/observability/go.mod
        cache-dependency-path: shared/observability/go.sum
    - name: Check observability independently
      if: ${{ !cancelled() && steps.go_observability.outcome == 'success' }}
      working-directory: ./shared/observability
      run: test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test -race -count=1 ./...
    - uses: actions/setup-go@v6
      id: go_secretmaterial
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      with:
        go-version-file: shared/secretmaterial/go.mod
        cache-dependency-path: shared/secretmaterial/go.sum
    - name: Check secret material independently
      if: ${{ !cancelled() && steps.go_secretmaterial.outcome == 'success' }}
      working-directory: ./shared/secretmaterial
      run: test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test -race -count=1 ./...
    - uses: actions/setup-go@v6
      id: go_scylla_cdc
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      with:
        go-version-file: shared/scylla-cdc-go/go.mod
        cache-dependency-path: shared/scylla-cdc-go/go.sum
    - name: Check Scylla CDC reader independently
      if: ${{ !cancelled() && steps.go_scylla_cdc.outcome == 'success' }}
      working-directory: ./shared/scylla-cdc-go
      run: test -z "$(gofmt -l .)" && go build ./... && go vet ./... && go test -race -count=1 ./...

  git-service-test:
    name: Git Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gitstore-git-service

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt, clippy

    - name: Install protoc
      run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          gitstore-git-service/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Generate test coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cargo install cargo-tarpaulin || true
        cargo tarpaulin --out Xml --output-dir ./coverage
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v7
      with:
        files: ./gitstore-git-service/coverage/cobertura.xml
        flags: rust
        name: rust-coverage
      continue-on-error: true

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gitstore-api

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.2'
        cache-dependency-path: gitstore-api/go.sum

    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Verify enrollment output secrecy
      working-directory: .
      run: ./scripts/check-enroll-serviceaccount-output.sh

    - name: Check service-account credential logging
      working-directory: .
      run: make check TARGET=credentials

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./gitstore-api/coverage.txt
        flags: go
        name: go-coverage
      continue-on-error: true

  controller-manager-test:
    name: Controller Manager Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gitstore-controller-manager

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.2'
        cache-dependency-path: gitstore-controller-manager/go.sum

    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./gitstore-controller-manager/coverage.txt
        flags: go-controller-manager
        name: controller-manager-coverage
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.2'
        cache: false
    - uses: dtolnay/rust-toolchain@1.99.1

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Audit Rust dependencies
      working-directory: ./gitstore-git-service
      run: |
        cargo install cargo-audit || true
        cargo audit
      continue-on-error: true

    - name: Audit Go dependencies
      working-directory: ./gitstore-api
      run: |
        go install github.com/sonatype-nexus-community/nancy@latest
        go list -json -m all | nancy sleuth
      continue-on-error: true
