name: Admin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: gitstore-admin/pnpm-lock.yaml
      - run: make install
      - run: pnpm --dir gitstore-admin exec playwright install --with-deps chromium firefox webkit
      - name: Validate and build Admin and Storybook
        run: make check TARGET=all
        timeout-minutes: 5
        env:
          CI: true
          STORYBOOK_DISABLE_TELEMETRY: 1
      - name: Browser tests and server teardown
        run: make test TARGET=e2e E2E_ARGS="--shard=${{ matrix.shard }}/2"
        timeout-minutes: 5
        env:
          CI: true
          STORYBOOK_DISABLE_TELEMETRY: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-results-${{ matrix.shard }}
          path: |
            gitstore-admin/playwright-report
            gitstore-admin/test-results
          if-no-files-found: ignore
