name: CD Optional Images

# Builds and publishes images for GitStore's optional services (admin UI,
# oidc-bridge, and future ones like a storefront) — not part of the core
# git-service/api/controller-manager stack built by cd.yml. Deliberately
# decoupled: an optional service failing to build must never block or
# gate the core release pipeline, and the core pipeline's deploy jobs
# never depend on these images.

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-optional-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ADMIN_IMAGE: ${{ github.repository_owner }}/admin
  OIDC_BRIDGE_IMAGE: ${{ github.repository_owner }}/oidc-bridge

jobs:
  compute-latest-eligibility:
    name: Compute latest tag eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_enable: ${{ steps.compute.outputs.latest_enable }}
    steps:
    - name: Determine whether this build may own the latest tag
      id: compute
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # Mirrors cd.yml's own compute-latest-eligibility job: latest should
        # track the newest build (prerelease included) until the first
        # stable release ships, then permanently stop tracking prereleases.
        if [ "$REF_TYPE" != "tag" ]; then
          echo "latest_enable=false" >> "$GITHUB_OUTPUT"
        elif [[ "$REF_NAME" != v*-* ]]; then
          echo "latest_enable=true" >> "$GITHUB_OUTPUT"
        else
          has_stable=$(gh release list --repo "$REPO" --json tagName,isPrerelease --limit 100 \
            | jq 'any(.isPrerelease == false)')
          if [ "$has_stable" = "true" ]; then
            echo "latest_enable=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest_enable=true" >> "$GITHUB_OUTPUT"
          fi
        fi

  build-admin-image:
    name: Build and Push Admin Image
    runs-on: ubuntu-latest
    needs: [compute-latest-eligibility]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Admin
      id: meta-admin
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE }}
        flavor: |
          latest=${{ needs.compute-latest-eligibility.outputs.latest_enable }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}

    - name: Build and push Admin image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/admin.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-admin.outputs.tags }}
        labels: ${{ steps.meta-admin.outputs.labels }}
        cache-from: type=gha,scope=admin
        cache-to: type=gha,mode=max,scope=admin
        outputs: >-
          type=image,name=target,"annotation-index.org.opencontainers.image.description=GitStore admin web interface for managing products, categories, collections, and catalog publishing"

  build-oidc-bridge-image:
    name: Build and Push OIDC Bridge Image
    runs-on: ubuntu-latest
    needs: [compute-latest-eligibility]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for OIDC Bridge
      id: meta-oidc-bridge
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.OIDC_BRIDGE_IMAGE }}
        flavor: |
          latest=${{ needs.compute-latest-eligibility.outputs.latest_enable }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}

    - name: Build and push OIDC Bridge image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/oidc-bridge.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-oidc-bridge.outputs.tags }}
        labels: ${{ steps.meta-oidc-bridge.outputs.labels }}
        cache-from: type=gha,scope=oidc-bridge
        cache-to: type=gha,mode=max,scope=oidc-bridge
        outputs: >-
          type=image,name=target,"annotation-index.org.opencontainers.image.description=GitStore reference OIDC bridge connecting Ory Hydra and Ory Kratos for the optional reference identity provider stack"
