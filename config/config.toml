# Development-only shared configuration for the Docker Compose local profile.
# Do not reuse these credentials outside an isolated developer workstation.
# This file is mounted into git-service, api, and controller-manager, so it
# must never contain service-account key material. The local Compose profile
# mounts the API issuer key and controller private key separately.

[git_service]
grpc_port = 50051
data_dir = "/var/lib/gitstore/repos"

[git_service.catalog]
uri = "dns:///api:6000"

[git_service.validation]
timeout = "10s"

[git_service.admission]
branch_pattern = "^refs/heads/main$"

[api]
port = 4000
git_port = 9000
grpc_port = 6000

[api.rate_limit]
per_second = 50
burst = 100

[api.git_service]
uri = "dns:///git-service:50051"

[api.datastore]
backend = "memdb"

[api.auth.static_users]
users_file = "/etc/gitstore/users.yaml"

[api.auth.jwt]
secret = "local-development-jwt-secret-at-least-32-characters"
ttl = "24h"
issuer = "gitstore"
refresh_grace = "60s"

[api.auth.authn]
chain = ["static-users", "serviceaccount-assertion", "serviceaccount-jwt", "anonymous"]

[api.auth.serviceaccount]
issuer = "gitstore"
audience = "gitstore-api"
assertion_audience = "gitstore-api/serviceaccount-token"
# The API issuer key is injected from its API-only /run/secrets mount.

[api.auth.authz]
provider = "rbac-local"

[api.auth.userdir]
provider = "static-users"

# Optional OIDC Relying Party. Uncomment and chain "oidc-jwt" into
# api.auth.authn.chain to verify bearer tokens against any standards-compliant
# OIDC issuer — e.g. the optional reference stack (make compose IDENTITY=oidc).
# [api.auth.oidc_jwt]
# issuer_uri = "http://localhost:4444/"
# client_id = "gitstore"
# audience = ""        # defaults to client_id
# clock_skew = "2m"
# username_claim = "sub"  # claim that becomes Principal.Subject (bindings/audit);
                          # "email" or "preferred_username" = human-readable but mutable

[api.auth.rbac_local]
policy_file = "/etc/gitstore/policy.yaml"

[controller]
port = 5001
api_uri = "http://api:4000/graphql"

[controller.api_client.rate_limit]
# Shared across all reconciliation kinds; leave room under the API's IP budget
# for credential renewal. Replicas sharing an egress IP must share that budget.
per_second = 40
burst = 10

# The UID is provisioned by the Compose enrollment job into a controller-only mount.
[controller.serviceaccount]
namespace = "controllers"
name = "gitstore-controller-manager"
key_ref = { kind = "SecretRef", name = "gitstore-controller-manager-signing-key" }
assertion_audience = "gitstore-api/serviceaccount-token"
access_token_audience = "gitstore-api"

[controller.secret_providers.bootstrap]
type = "file"
base_path = "/run/secrets"

[controller.reconcile]
max_attempts = 5
stall_threshold = "5m"

[controller.checkpoint]
dir = "/var/lib/gitstore/checkpoints"
flush_interval_events = 100

[controller.watch]
max_backoff = "30s"
resync_interval = "10m"

[grpc_auth]
hmac_secret = "local-development-grpc-hmac-secret"

[push_limits]
max_pack_size = "512MiB"
max_file_size = "100MiB"

[log]
level = "info"
format = "json"
