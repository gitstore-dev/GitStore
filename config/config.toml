# Development-only shared configuration for the Docker Compose local profile.
# Do not reuse these credentials outside an isolated developer workstation.
# This file is mounted into git-service, api, and controller-manager, so it
# must never contain service-account key material. The local Compose profile
# mounts the API issuer key and controller private key separately.

[grpc]
port = 50051

[git]
data_dir = "/var/lib/gitstore/repos"

[git.repo]
max_file_size = 52428800
max_pack_size_bytes = 52428800

[hooks.git_receive_pack]
pre_receive = { enabled = true }
update = { enabled = false }
post_receive = { enabled = true }
proc_receive = { enabled = false }
post_update = { enabled = false }
reference_transaction = { enabled = false }

[schema_validation]
phase = "pre-receive"
timeout_secs = 10

[admission_control]
phase = "post-receive"
branch_pattern = "refs/heads/.*"

[catalog_service]
uri = "http://api:6000"

[api]
port = 4000
git_port = 9000
grpc_port = 6000
rate_limit_per_second = 50
rate_limit_burst = 100

[git.grpc]
uri = "dns:///git-service:50051"

[datastore]
backend = "memdb"

[auth.staticusers]
users_file = "/etc/gitstore/users.yaml"

[auth.jwt]
secret = "local-development-jwt-secret-at-least-32-characters"
duration = "24h"
issuer = "gitstore"
refresh_grace = "60s"

[auth.grpc]
hmac_secret = "local-development-grpc-hmac-secret"

[auth.authn]
chain = ["static-users", "serviceaccount-assertion", "serviceaccount-jwt", "anonymous"]

[auth.serviceaccount]
issuer = "gitstore"
audience = "gitstore-api"
assertion_audience = "gitstore-api/serviceaccount-token"
# The API issuer key is injected from its API-only /run/secrets mount.

[auth.authz]
provider = "rbac-local"

[auth.userdir]
provider = "static-users"

[auth.rbac]
policy_file = "/etc/gitstore/policy.yaml"

[controller]
port = 5001
api_uri = "http://api:4000/graphql"
# The UID is provisioned by the Compose enrollment job into a controller-only mount.
serviceaccount_namespace = "controllers"
serviceaccount_name = "gitstore-controller-manager"
serviceaccount_key_id = "controller-key"
serviceaccount_key_ref = { kind = "SecretRef", name = "gitstore-controller-manager-signing-key", key = "privateKey" }
serviceaccount_assertion_audience = "gitstore-api/serviceaccount-token"
serviceaccount_access_token_audience = "gitstore-api"
secret_provider_bootstrap = { type = "file", base_path = "/run/secrets" }
default_max_attempts = 5
default_stall_threshold = "5m"
checkpoint_dir = "/var/lib/gitstore/checkpoints"
checkpoint_flush_interval_events = 100
max_watch_backoff = "30s"

[features]
namespace_repository_fence = "auto"

[log]
level = "info"
format = "json"
