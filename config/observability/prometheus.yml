global:
  scrape_interval: 10s
  scrape_timeout: 3s
scrape_configs:
  - job_name: gitstore-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
