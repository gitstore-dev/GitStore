# Load only when GitStore's Kratos UserDir and private webhook listener are enabled.
courier:
  delivery_strategy: http
selfservice:
  flows:
    registration:
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://api:8085/internal/userdir/kratos/registration
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                response:
                  ignore: false
                  parse: true
            - hook: session
    settings:
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://api:8085/internal/userdir/kratos/settings-password
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                response:
                  ignore: false
                  parse: true
        profile:
          hooks:
            - hook: web_hook
              config:
                url: http://api:8085/internal/userdir/kratos/settings
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                response:
                  ignore: false
                  parse: true
