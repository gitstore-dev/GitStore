services:
  git-service:
    profiles: [local]
    command: ["/app/git-service", "--config-file", "/etc/gitstore/gitstore.toml"]
    volumes:
      - ${CONFIG_FILE:-./config/config.toml}:/etc/gitstore/gitstore.toml:ro

  api:
    profiles: [local]
    # The API issuer key is intentionally read from this API-only mount. The
    # shared gitstore.toml must never contain api.auth.serviceaccount.signing_key.
    command:
      - /app/api
      - --config-file
      - /etc/gitstore/gitstore.toml
      - --serviceaccount-signing-key-file
      - /run/secrets/serviceaccount-signing-key
    volumes:
      - ${CONFIG_FILE:-./config/config.toml}:/etc/gitstore/gitstore.toml:ro
      - ./config/policy.yaml:/etc/gitstore/policy.yaml:ro
      - ./config/users.yaml:/etc/gitstore/users.yaml:ro
      - api-serviceaccount-issuer-key:/run/secrets:ro
    depends_on:
      credential-bootstrap:
        condition: service_completed_successfully

  controller-manager:
    profiles: [local]
    command:
      - /app/controller-manager
      - --config-file
      - /etc/gitstore/gitstore.toml
      - --config-file
      - /run/controller-bootstrap/serviceaccount.toml
    volumes:
      - ${CONFIG_FILE:-./config/config.toml}:/etc/gitstore/gitstore.toml:ro
      - controller-checkpoints:/var/lib/gitstore/checkpoints
      - controller-serviceaccount-secrets:/run/secrets:ro
      - controller-serviceaccount-identity:/run/controller-bootstrap:ro
    depends_on:
      serviceaccount-enrollment:
        condition: service_completed_successfully

  credential-bootstrap:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Only initialization needs root to prepare the named credential volumes.
    user: "0:0"
    command:
      - /app/api
      - gitctl
      - bootstrap
      - api
      - --private-key-path
      - /run/api-issuer/serviceaccount-signing-key
      - --owner-uid
      - "65532"
      - --owner-gid
      - "65532"
    volumes:
      - api-serviceaccount-issuer-key:/run/api-issuer
    network_mode: none

  controller-credential-bootstrap:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    user: "0:0"
    command:
      - /app/api
      - gitctl
      - bootstrap
      - controller
      - --private-key-path
      - /run/controller-secrets/.controller-enrollment-key
      - --record-output-path
      - /run/controller-secrets/gitstore-controller-manager-signing-key.json
      - --key-id
      - controller-key
    volumes:
      - controller-serviceaccount-secrets:/run/controller-secrets
    network_mode: none

  serviceaccount-enrollment:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    user: "0:0"
    environment:
      GITSTORE_BOOTSTRAP_ADMIN_USERNAME: ${GITSTORE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GITSTORE_BOOTSTRAP_ADMIN_PASSWORD: ${GITSTORE_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    command:
      - /app/api
      - gitctl
      - enroll-serviceaccount
      - --api-url
      - http://api:4000/admin/graphql
      - --name
      - gitstore-controller-manager
      - --key-id
      - controller-key
      - --replace-existing-key
      - --private-key-path
      - /run/controller-secrets/.controller-enrollment-key
      - --identity-output-path
      - /run/controller-bootstrap/serviceaccount.toml
      - --identity-output-format
      - toml
      # memdb creates a new UID after restart; retain keys and explicitly rebind identity.
      - --replace-identity
    depends_on:
      api:
        condition: service_healthy
      controller-credential-bootstrap:
        condition: service_completed_successfully
    networks:
      - gitstore-network
    volumes:
      - controller-serviceaccount-secrets:/run/controller-secrets:ro
      - controller-serviceaccount-identity:/run/controller-bootstrap

volumes:
  controller-checkpoints:
    driver: local
