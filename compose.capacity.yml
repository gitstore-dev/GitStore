services:
  api-a: &capacity-api
    profiles: [capacity-stack]
    image: ${CAPACITY_API_IMAGE:-gitstore-capacity-api:${CAPACITY_GIT_REVISION:-unknown}}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        GIT_REVISION: ${CAPACITY_GIT_REVISION:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-api-a
    labels: &capacity-ownership-labels
      dev.gitstore.capacity.run: ${CAPACITY_RUN_ID:-unowned}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${REPOSITORY_CAPACITY_SECRET_SCENARIO:-0}" = 1 ]; then
          export GITSTORE_API__AUTH__SERVICEACCOUNT__DEFAULT_TTL=60s
          export GITSTORE_API__AUTH__SERVICEACCOUNT__MAX_TTL=60s
        fi
        export GITSTORE_API__AUTH__SERVICEACCOUNT__SIGNING_KEY="$$(cat /run/secrets/serviceaccount-signing-key)"
        exec /app/api --config-file /etc/gitstore/gitstore.toml
    environment: &capacity-api-environment
      GITSTORE_OBSERVABILITY__OTLP__URI: ${CAPACITY_OTLP_URI:-}
      GITSTORE_OBSERVABILITY__OTLP__TRACE_SAMPLE_RATIO: ${CAPACITY_TRACE_SAMPLE_RATIO:-0.05}
      GITSTORE_API__PROFILING__URI: ${CAPACITY_API_PROFILE_URI:-}
      REPOSITORY_CAPACITY_SECRET_SCENARIO: ${REPOSITORY_CAPACITY_SECRET_SCENARIO:-0}
      GITSTORE_API__DATASTORE__BACKEND: scylla
      GITSTORE_API__DATASTORE__SCYLLA__HOSTS: scylla-1:9042,scylla-2:9042,scylla-3:9042
      GITSTORE_API__DATASTORE__SCYLLA__KEYSPACE: ${CAPACITY_SCYLLA_KEYSPACE:-gitstore}
      GITSTORE_API__GIT_SERVICE__URI: dns:///capacity-git-service:50051
      GITSTORE_API__WATCH__JOURNAL__RETENTION: 168h
      GITSTORE_API__WATCH__JOURNAL__CDC__CONFIDENCE_WINDOW: 500ms
      GITSTORE_API__WATCH__JOURNAL__READ__BATCH_SIZE: "256"
      GITSTORE_API__WATCH__JOURNAL__READ__MAX_REPLAY_EVENTS: "100000"
      GITSTORE_API__WATCH__JOURNAL__SUBSCRIBER__BUFFER: "64"
      GITSTORE_API__WATCH__JOURNAL__SUBSCRIBER__BACKPRESSURE: 30s
      GITSTORE_API__WATCH__JOURNAL__POLL__MIN: 100ms
      GITSTORE_API__WATCH__JOURNAL__POLL__MAX: 2s
      GITSTORE_API__WATCH__JOURNAL__BOOKMARK_INTERVAL: 30s
      GITSTORE_API__WATCH__JOURNAL__MATERIALIZER__LEASE_TTL: 30s
      GITSTORE_API__WATCH__JOURNAL__MATERIALIZER__LEASE_RENEW_INTERVAL: 10s
      GITSTORE_API__WATCH__JOURNAL__MATERIALIZER__MAX_LAG: 60s
    ports:
      - "${CAPACITY_API_A_PORT:-4000}:4000"
      - "${CAPACITY_GIT_HTTP_A_PORT:-9000}:9000"
      - "${CAPACITY_CATALOG_A_PORT:-6000}:6000"
    volumes:
      - ${CONFIG_FILE:-./config/config.toml}:/etc/gitstore/gitstore.toml:ro
      - ${POLICY_FILE:-./config/policy.yaml}:/etc/gitstore/policy.yaml:ro
      - ${USERS_FILE:-./config/users.yaml}:/etc/gitstore/users.yaml:ro
      - api-serviceaccount-issuer-key:/run/secrets:ro
    depends_on:
      capacity-credential-bootstrap:
        condition: service_completed_successfully
      scylla-init:
        condition: service_completed_successfully
      capacity-git-service:
        condition: service_started
    networks:
      - gitstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  api-b:
    <<: *capacity-api
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-api-b
    environment:
      <<: *capacity-api-environment
    depends_on:
      capacity-credential-bootstrap:
        condition: service_completed_successfully
      scylla-init:
        condition: service_completed_successfully
      capacity-git-service:
        condition: service_started
      api-a:
        condition: service_healthy
    ports:
      - "${CAPACITY_API_B_PORT:-4001}:4000"
      - "${CAPACITY_GIT_HTTP_B_PORT:-9001}:9000"
      - "${CAPACITY_CATALOG_B_PORT:-6001}:6000"

  capacity-credential-bootstrap:
    <<: *capacity-api
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-capacity-credential-bootstrap
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/controller-secrets/gitstore-controller-manager-signing-key
        rm -f /run/controller-bootstrap/serviceaccount.env
        /app/gitctl generate-signing-key --private-key-path /run/api-issuer/serviceaccount-signing-key
        /app/gitctl generate-signing-key --private-key-path /run/controller-secrets/gitstore-controller-manager-signing-key/privateKey --record-output-path /run/controller-secrets/gitstore-controller-manager-signing-key.json --key-id controller-key
    environment: {}
    ports: []
    volumes:
      - api-serviceaccount-issuer-key:/run/api-issuer
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    depends_on: {}
    healthcheck:
      disable: true

  capacity-serviceaccount-enrollment:
    <<: *capacity-api
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-capacity-serviceaccount-enrollment
    environment:
      GITSTORE_BOOTSTRAP_ADMIN_USERNAME: ${GITSTORE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GITSTORE_BOOTSTRAP_ADMIN_PASSWORD: ${GITSTORE_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    command:
      - /app/gitctl
      - enroll-serviceaccount
      - --api-url
      - http://api-a:4000/graphql
      - --name
      - gitstore-controller-manager
      - --key-id
      - controller-key
      - --replace-existing-key
      - --private-key-path
      - /run/controller-secrets/gitstore-controller-manager-signing-key/privateKey
      - --identity-output-path
      - /run/controller-bootstrap/serviceaccount.env
    ports: []
    volumes:
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    depends_on:
      api-a:
        condition: service_healthy
    healthcheck:
      disable: true

  capacity-git-service:
    profiles: [capacity-stack]
    image: ${CAPACITY_GIT_SERVICE_IMAGE:-gitstore-capacity-git-service:${CAPACITY_GIT_REVISION:-unknown}}
    build:
      context: .
      dockerfile: docker/git-service.Dockerfile
      args:
        GIT_REVISION: ${CAPACITY_GIT_REVISION:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-capacity-git-service
    labels: *capacity-ownership-labels
    command: ["/app/git-service", "--config-file", "/etc/gitstore/gitstore.toml"]
    environment:
      GITSTORE_GIT_SERVICE__CATALOG__URI: dns:///api-a:6000
      GITSTORE_OBSERVABILITY__OTLP__URI: ${CAPACITY_OTLP_URI:-}
      GITSTORE_OBSERVABILITY__OTLP__TRACE_SAMPLE_RATIO: ${CAPACITY_TRACE_SAMPLE_RATIO:-0.05}
      GITSTORE_GIT_SERVICE__METRICS__URI: ${CAPACITY_GIT_METRICS_URI:-}
    volumes:
      - ${CONFIG_FILE:-./config/config.toml}:/etc/gitstore/gitstore.toml:ro
      - git-repo-data-root:/var/lib/gitstore/repos
    networks:
      - gitstore-network

  controller-manager-a: &capacity-controller
    profiles: [capacity-stack]
    image: ${CAPACITY_CONTROLLER_IMAGE:-gitstore-capacity-controller-manager:${CAPACITY_GIT_REVISION:-unknown}}
    build:
      context: .
      dockerfile: docker/controller-manager.Dockerfile
      args:
        GIT_REVISION: ${CAPACITY_GIT_REVISION:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-controller-manager-a
    labels: *capacity-ownership-labels
    command:
      - /bin/sh
      - -ec
      - |
        serviceaccount_uid="$$(sed -n 's/^GITSTORE_CONTROLLER__SERVICEACCOUNT__UID=//p' /run/controller-bootstrap/serviceaccount.env)"
        test -n "$$serviceaccount_uid"
        export GITSTORE_CONTROLLER__SERVICEACCOUNT__UID="$$serviceaccount_uid"
        exec /app/controller-manager --config-file /etc/gitstore/gitstore.toml
    environment:
      GITSTORE_CONTROLLER__API_URI: http://api-a:4000/graphql
      GITSTORE_OBSERVABILITY__OTLP__URI: ${CAPACITY_OTLP_URI:-}
      GITSTORE_OBSERVABILITY__OTLP__TRACE_SAMPLE_RATIO: ${CAPACITY_TRACE_SAMPLE_RATIO:-0.05}
    ports:
      - "${CAPACITY_CONTROLLER_A_PORT:-5001}:5001"
    volumes:
      - ${CAPACITY_CONTROLLER_A_CONFIG_FILE:-${CONFIG_FILE:-./config/config.toml}}:/etc/gitstore/gitstore.toml:ro
      - controller-checkpoints-a:/var/lib/gitstore/checkpoints
      - ${CAPACITY_CONTROLLER_A_SECRET_SOURCE:-controller-serviceaccount-secrets}:/run/secrets:ro
      - controller-serviceaccount-identity:/run/controller-bootstrap:ro
    depends_on:
      capacity-serviceaccount-enrollment:
        condition: service_completed_successfully
    networks:
      - gitstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  controller-manager-b:
    <<: *capacity-controller
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-controller-manager-b
    environment:
      GITSTORE_CONTROLLER__API_URI: http://api-b:4000/graphql
      GITSTORE_OBSERVABILITY__OTLP__URI: ${CAPACITY_OTLP_URI:-}
      GITSTORE_OBSERVABILITY__OTLP__TRACE_SAMPLE_RATIO: ${CAPACITY_TRACE_SAMPLE_RATIO:-0.05}
    ports:
      - "${CAPACITY_CONTROLLER_B_PORT:-5002}:5001"
    volumes:
      - ${CAPACITY_CONTROLLER_B_CONFIG_FILE:-${CONFIG_FILE:-./config/config.toml}}:/etc/gitstore/gitstore.toml:ro
      - controller-checkpoints-b:/var/lib/gitstore/checkpoints
      - ${CAPACITY_CONTROLLER_B_SECRET_SOURCE:-controller-serviceaccount-secrets}:/run/secrets:ro
      - controller-serviceaccount-identity:/run/controller-bootstrap:ro

  scylla-1:
    profiles: [capacity-stack]
    image: scylladb/scylla:2026.1
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-scylla-1
    labels: *capacity-ownership-labels
    ports: !reset []

  scylla-2:
    profiles: [capacity-stack]
    image: scylladb/scylla:2026.1
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-scylla-2
    labels: *capacity-ownership-labels

  scylla-3:
    profiles: [capacity-stack]
    image: scylladb/scylla:2026.1
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-scylla-3
    labels: *capacity-ownership-labels

  scylla-init:
    profiles: [capacity-stack]
    image: scylladb/scylla:2026.1
    labels: *capacity-ownership-labels
    command:
      - cqlsh
      - scylla-1
      - -e
      - "CREATE KEYSPACE IF NOT EXISTS ${CAPACITY_SCYLLA_KEYSPACE:-gitstore} WITH replication = {'class': 'NetworkTopologyStrategy', 'datacenter1': '3'} AND durable_writes = true"

  capacity-prometheus:
    profiles: [capacity]
    image: prom/prometheus:v3.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-gitstore-repository-capacity}-capacity-prometheus
    labels: *capacity-ownership-labels
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${CAPACITY_PROMETHEUS_RETENTION:-24h}
      - --storage.tsdb.retention.size=512MB
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:${CAPACITY_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./tests/capacity/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CAPACITY_PROMETHEUS_TARGETS_FILE:-./tests/capacity/prometheus/empty-targets.json}:/etc/prometheus/targets.json:ro
      - capacity-prometheus-data:/prometheus
    cpus: "0.5"
    mem_limit: 256m
    networks:
      - gitstore-network

  capacity-otel-collector:
    profiles: [capacity]
    image: otel/opentelemetry-collector-contrib:0.162.0
    labels: *capacity-ownership-labels
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "127.0.0.1:${CAPACITY_OTLP_PORT:-4318}:4318"
      - "127.0.0.1:${CAPACITY_OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./tests/capacity/prometheus/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on: [capacity-tempo, capacity-loki]
    cpus: "0.5"
    mem_limit: 192m
    networks: [gitstore-network]
    logging: &capacity-collector-logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  capacity-tempo:
    profiles: [capacity]
    image: grafana/tempo:2.10.8
    labels: *capacity-ownership-labels
    command: ["-config.file=/etc/tempo/config.yml"]
    environment:
      GOMEMLIMIT: 256MiB
    ports:
      - "127.0.0.1:${CAPACITY_TEMPO_PORT:-3200}:3200"
    volumes:
      - ./tests/capacity/prometheus/tempo.yml:/etc/tempo/config.yml:ro
      - capacity-tempo-data:/var/tempo
    cpus: "0.5"
    mem_limit: 384m
    networks: [gitstore-network]
    logging: *capacity-collector-logging

  capacity-loki:
    profiles: [capacity]
    image: grafana/loki:3.7.8
    labels: *capacity-ownership-labels
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${CAPACITY_LOKI_PORT:-3100}:3100"
    volumes:
      - ./tests/capacity/prometheus/loki.yml:/etc/loki/config.yml:ro
      - capacity-loki-data:/loki
    cpus: "0.5"
    mem_limit: 384m
    networks: [gitstore-network]
    logging: *capacity-collector-logging

volumes:
  capacity-prometheus-data:
  capacity-tempo-data:
  capacity-loki-data:
  controller-checkpoints-a:
  controller-checkpoints-b:
